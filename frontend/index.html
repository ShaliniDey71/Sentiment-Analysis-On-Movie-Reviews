<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Sentiment Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Movie Sentiment Analysis</h1>
        <textarea id="reviewText" rows="5" cols="50" placeholder="Enter your movie review here..."></textarea><br><br>
        <button id="predictButton">Predict Sentiment</button>

        <div id="result" class="result-area" style="display: none;">
            <div id="predictionResult"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
